<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu cupón de regalo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pagina">
    <aside class="intro">
      <h1>Tu regalo<br>te espera</h1>
      <p>Responde tres datos y descubre qué cupón es para ti.</p>
    </aside>

    <main class="panel">
      <form id="formulario" novalidate>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre" required>

        <label for="edad">Edad</label>
        <input type="number" id="edad" min="1" max="120" placeholder="Tu edad" required>

        <fieldset>
          <legend>Sexo</legend>
          <div class="segmento">
            <label class="opcion"><input type="radio" name="sexo" value="nino"><span>Hombre</span></label>
            <label class="opcion"><input type="radio" name="sexo" value="nina"><span>Mujer</span></label>
          </div>
        </fieldset>

        <p id="error" role="alert"></p>
        <button type="submit">Generar cupón</button>
      </form>

      <section id="resultado" hidden></section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
